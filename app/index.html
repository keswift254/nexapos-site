<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/nexapos-site/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NexaPOS point of sale.">
  <!-- Missing until this fix - without it, iOS Safari lays the page out
       at a virtual ~980px desktop viewport and scales the whole thing
       down to fit, which breaks Flutter's canvas sizing/positioning
       badly enough to render as an effectively blank page. Every
       current `flutter create` template includes this by default; this
       project's index.html predates that and never picked it up. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NexaPOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NexaPOS</title>
  <link rel="manifest" href="manifest.json">
  <!-- Flutter's own bootstrap paints nothing until the whole app bundle
       has downloaded and compiled (several MB on a first visit), so the
       page sat blank white for as long as that took - indistinguishable
       from being hung, and the reason a slow phone connection read as
       "the site is broken". This is plain HTML/CSS, so it paints
       immediately, and it's removed the moment Flutter draws its first
       frame. Colors follow the OS light/dark setting so it never flashes
       the wrong one. -->
  <style>
    html, body { margin: 0; height: 100%; background: #fbf8ff; }
    #nexapos-splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: #fbf8ff; color: #3b3a4a;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      padding: 24px;
    }
    #nexapos-splash .brand { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    #nexapos-splash .spinner {
      width: 38px; height: 38px; border-radius: 50%;
      border: 4px solid rgba(80, 90, 140, 0.2); border-top-color: #505a8c;
      animation: nexapos-spin 0.9s linear infinite;
    }
    #nexapos-splash .hint { font-size: 13px; opacity: 0.7; max-width: 300px; line-height: 1.45; }
    @keyframes nexapos-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body, #nexapos-splash { background: #14131a; color: #e6e3f0; }
      #nexapos-splash .spinner { border-color: rgba(200, 205, 240, 0.2); border-top-color: #b7bdf0; }
    }
  </style>
</head>
<body>
  <div id="nexapos-splash">
    <div class="brand">NexaPOS</div>
    <div class="spinner"></div>
    <div class="hint" id="nexapos-splash-hint">Loading the app... the first visit downloads it once, after that it opens quickly.</div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('nexapos-splash');
      var hint = document.getElementById('nexapos-splash-hint');
      window.addEventListener('flutter-first-frame', function () {
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      });
      // Reassure rather than leave a spinner that looks stuck: past this
      // point it really is a slow connection, not a hang.
      setTimeout(function () {
        if (hint && splash && splash.parentNode) {
          hint.textContent = 'Still loading - this can take a minute on a slow connection. Please keep this page open.';
        }
      }, 25000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
