<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/nexapos-site/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NexaPOS point of sale.">
  <!-- Missing until this fix - without it, iOS Safari lays the page out
       at a virtual ~980px desktop viewport and scales the whole thing
       down to fit, which breaks Flutter's canvas sizing/positioning
       badly enough to render as an effectively blank page. Every
       current `flutter create` template includes this by default; this
       project's index.html predates that and never picked it up. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NexaPOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NexaPOS</title>
  <!-- iOS installs a Home Screen web app into a storage container that is
       separate from Safari.  NexaPOS deliberately asks iOS for browser mode
       so the shortcut reopens the same Safari/IndexedDB shop instead of
       looking like a brand-new device. Other platforms keep the normal
       standalone app experience. -->
  <script>
    (function () {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var manifest = document.createElement('link');
      manifest.rel = 'manifest';
      manifest.href = isIOS ? 'manifest-ios.json' : 'manifest.json';
      document.head.appendChild(manifest);
    })();
  </script>
  <!-- Flutter's own bootstrap paints nothing until the whole app bundle
       has downloaded and compiled (several MB on a first visit), so the
       page sat blank white for as long as that took - indistinguishable
       from being hung, and the reason a slow phone connection read as
       "the site is broken". This is plain HTML/CSS, so it paints
       immediately, and it's removed the moment Flutter draws its first
       frame. Colors follow the OS light/dark setting so it never flashes
       the wrong one. -->
  <style>
    html, body { margin: 0; height: 100%; background: #fbf8ff; }
    #nexapos-splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: #fbf8ff; color: #3b3a4a;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      padding: 24px;
    }
    #nexapos-splash .brand { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    #nexapos-splash .spinner-wrap { position: relative; width: 68px; height: 68px; }
    #nexapos-splash .spinner {
      position: absolute; inset: 0; border-radius: 50%;
      border: 4px solid rgba(80, 90, 140, 0.2); border-top-color: #505a8c;
      animation: nexapos-spin 0.9s linear infinite;
    }
    #nexapos-splash .pct {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: #505a8c;
    }
    #nexapos-splash .hint { font-size: 13px; opacity: 0.7; max-width: 300px; line-height: 1.45; }
    @keyframes nexapos-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body, #nexapos-splash { background: #14131a; color: #e6e3f0; }
      #nexapos-splash .spinner { border-color: rgba(200, 205, 240, 0.2); border-top-color: #b7bdf0; }
      #nexapos-splash .pct { color: #b7bdf0; }
    }
  </style>
</head>
<body>
  <div id="nexapos-splash">
    <div class="brand">NexaPOS</div>
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="pct" id="nexapos-splash-pct" aria-live="off"></div>
    </div>
    <div class="hint" id="nexapos-splash-hint">Loading the app... the first visit downloads it once, after that it opens quickly.</div>
  </div>
  <script>
    // Byte sizes (decoded) of the big downloads, written in at build time by
    // release-tools/stamp-web-sizes.py so the percentage below is measured against
    // the real files. Left as null (and the built-in figures used) if not stamped.
    window.NEXAPOS_LOAD_SIZES = /*NEXAPOS_SIZES*/{"canvaskit.wasm": 7284349, "chromium/canvaskit.wasm": 5428553, "drift_worker.js": 355222, "main.dart.js": 6070155, "sqlite3mc.wasm": 795141, "webparagraph/canvaskit.wasm": 3729073};
    (function () {
      var splash = document.getElementById('nexapos-splash');
      var hint = document.getElementById('nexapos-splash-hint');
      var pctEl = document.getElementById('nexapos-splash-pct');
      var firstFrame = false;

      // ---- the percentage -------------------------------------------------
      // What it means: the share of the app's expected download that has really
      // arrived, weighted by how long each file takes on the wire (bigger and
      // less compressible = more of the wait). It can only go up, and it stays
      // at 99% until Flutter has actually drawn its first frame, so it never
      // claims "done" while the screen is still the loading screen.
      var STAGES = [
        { key: 'canvaskit.wasm', bytes: 7284349, ratio: 2.6 },
        { key: 'main.dart.js', bytes: 6054884, ratio: 3.4 },
        { key: 'sqlite3mc.wasm', bytes: 795141, ratio: 2.1 },
        { key: 'drift_worker.js', bytes: 355222, ratio: 3.5 }
      ];
      var stamped = window.NEXAPOS_LOAD_SIZES || {};
      var i;
      for (i = 0; i < STAGES.length; i++) {
        STAGES[i].total = STAGES[i].bytes;
        STAGES[i].loaded = 0;      // decoded bytes actually read (only for fetch()ed files)
        STAGES[i].startedAt = 0;
        STAGES[i].done = false;
        STAGES[i].doneAt = 0;
      }

      function pathOf(url) {
        return String(url || '').split('?')[0].split('#')[0];
      }
      function endsWithSegment(path, key) {
        return path.slice(-(key.length + 1)) === '/' + key;
      }
      function matchStage(url) {
        var path = pathOf(url), k;
        for (k = 0; k < STAGES.length; k++) if (endsWithSegment(path, STAGES[k].key)) return STAGES[k];
        return null;
      }
      // The exact size of the file being fetched: the stamped size of the
      // longest matching path (CanvasKit has several variants of the same file
      // name), else the stage's built-in figure.
      function sizeFor(stage, url) {
        var path = pathOf(url), best = null, key;
        for (key in stamped) {
          if (Object.prototype.hasOwnProperty.call(stamped, key) && endsWithSegment(path, key) &&
              (best === null || key.length > best.length)) best = key;
        }
        return best !== null && stamped[best] > 0 ? stamped[best] : stage.bytes;
      }
      for (i = 0; i < STAGES.length; i++) {
        var stampedSize = stamped[STAGES[i].key];
        if (stampedSize > 0) STAGES[i].total = stampedSize;
      }

      // Real byte counts for anything loaded with fetch() (CanvasKit, the
      // database wasm): read a clone of the response as it streams in.
      var realFetch = window.fetch;
      if (realFetch && window.Response && Response.prototype.clone) {
        window.fetch = function (input) {
          var promise = realFetch.apply(this, arguments);
          try {
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            var stage = matchStage(url);
            if (stage && !stage.done) {
              stage.startedAt = stage.startedAt || Date.now();
              stage.total = sizeFor(stage, url);
              promise.then(function (res) { countBytes(stage, res); }, function () {});
            }
          } catch (e) {}
          return promise;
        };
      }
      function countBytes(stage, res) {
        try {
          if (!res.ok || !res.body || !res.body.getReader) return;
          var reader = res.clone().body.getReader();
          (function pump() {
            reader.read().then(function (chunk) {
              if (chunk.done) return;
              stage.loaded += chunk.value.length;
              pump();
            }, function () {});
          })();
        } catch (e) {}
      }

      // Script-tag loads (main.dart.js) can't be streamed: note when the tag is
      // added, then completion arrives through the resource-timing entries below.
      try {
        new MutationObserver(function (records) {
          var r, n, node, stage;
          for (r = 0; r < records.length; r++) {
            for (n = 0; n < records[r].addedNodes.length; n++) {
              node = records[r].addedNodes[n];
              if (node.tagName === 'SCRIPT' && node.src) {
                stage = matchStage(node.src);
                if (stage && !stage.startedAt) stage.startedAt = Date.now();
              }
            }
          }
        }).observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {}

      var measuredBytes = 0, measuredMs = 0;   // observed download speed, from finished files
      function noteFinished() {
        var entries;
        try { entries = performance.getEntriesByType('resource'); } catch (e) { return; }
        var e, stage;
        for (e = 0; e < entries.length; e++) {
          stage = matchStage(entries[e].name);
          if (stage && !stage.done && entries[e].responseEnd > 0) {
            stage.done = true;
            stage.doneAt = Date.now();
            // Only files that really took time say anything about the connection.
            if (entries[e].duration > 300) { measuredBytes += stage.total; measuredMs += entries[e].duration; }
          }
        }
      }

      function stageProgress(stage, now) {
        if (stage.done) return 1;
        if (stage.loaded > 0) return Math.min(0.98, stage.loaded / stage.total);
        if (!stage.startedAt) return 0;
        var seconds = (now - stage.startedAt) / 1000;
        // No byte count for this one (a script tag): estimate from the speed the
        // earlier files were seen to download at, and never claim more than 90%.
        if (measuredMs > 0) return Math.min(0.9, seconds * (measuredBytes / (measuredMs / 1000)) / stage.total);
        // Nothing measured yet (e.g. CanvasKit came from cache). Use the browser's own
        // connection-speed hint where it has one (Chrome, Edge, Android), else assume a
        // slow-ish connection. Either way it eases toward 90% rather than jumping.
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var tau = 20;
        if (conn && conn.downlink > 0) {
          tau = Math.min(30, Math.max(4, (stage.total / stage.ratio) * 8 / (conn.downlink * 1e6) / 2));
        }
        return 0.9 * (1 - Math.exp(-seconds / tau));
      }

      var shown = 0;
      function update() {
        if (firstFrame) return;
        noteFinished();
        var now = Date.now(), total = 0, got = 0, allDone = true, lastDone = 0, s, weight;
        for (s = 0; s < STAGES.length; s++) {
          weight = STAGES[s].total / STAGES[s].ratio;
          total += weight;
          got += weight * stageProgress(STAGES[s], now);
          if (!STAGES[s].done) allDone = false;
          if (STAGES[s].doneAt > lastDone) lastDone = STAGES[s].doneAt;
        }
        // Starting the app once everything is here (engine start, opening the
        // local database, first draw) is a short last stage of its own.
        var boot = total * 0.07;
        if (allDone) got += boot * 0.95 * (1 - Math.exp(-(now - lastDone) / 3000));
        total += boot;
        var percent = Math.floor(got / total * 100);
        shown = Math.max(shown, Math.min(99, percent));
        if (pctEl) pctEl.textContent = shown + '%';
      }
      update();
      var timer = setInterval(update, 250);

      window.addEventListener('flutter-first-frame', function () {
        firstFrame = true;
        clearInterval(timer);
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      });
      // Reassure rather than leave a spinner that looks stuck: past this
      // point it really is a slow connection, not a hang.
      setTimeout(function () {
        if (hint && splash && splash.parentNode) {
          hint.textContent = 'Still loading - this can take a minute on a slow connection. Please keep this page open.';
        }
      }, 25000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Start the offline cache immediately. NEXAPOS_SERVICE_WORKER_READY does
    // not resolve until the worker is activated, so tests and diagnostics
    // cannot report a merely-registered (but unusable) worker as ready.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      function activated(registration) {
        var worker = registration.active || registration.waiting || registration.installing;
        if (!worker || worker.state === 'activated') return Promise.resolve(registration);
        return new Promise(function (resolve, reject) {
          var timeout = setTimeout(function () { reject(new Error('Service worker activation timed out.')); }, 120000);
          worker.addEventListener('statechange', function () {
            if (worker.state === 'activated') {
              clearTimeout(timeout);
              resolve(registration);
            } else if (worker.state === 'redundant') {
              clearTimeout(timeout);
              reject(new Error('Service worker became redundant.'));
            }
          });
        });
      }
      var workerUrl = new URL('nexapos_service_worker.js', document.baseURI);
      // Flutter selects the Chromium CanvasKit build for Chromium-family
      // browsers; everyone else uses the plain build. This hint keeps the
      // immediate install from downloading the unused 5-7 MB variant.
      if (/Chrome|Chromium|Edg\//.test(navigator.userAgent) && !/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        workerUrl.search = '?canvaskit=chromium';
      } else {
        workerUrl.search = '?canvaskit=plain';
      }
      var workerScope = new URL('./', document.baseURI).pathname;
      window.NEXAPOS_SERVICE_WORKER_READY = navigator.serviceWorker
        .register(workerUrl, { scope: workerScope })
        .then(activated)
        .then(function (registration) {
          window.addEventListener('online', function () { registration.update(); });
          return registration;
        })
        .catch(function (error) {
          console.warn('NexaPOS offline cache could not start:', error);
          return null;
        });

      // Best effort: supported browsers may protect IndexedDB/OPFS and the
      // application cache from storage-pressure eviction. A denial is normal
      // and must never block startup.
      if (navigator.storage && navigator.storage.persist) {
        window.NEXAPOS_PERSISTENT_STORAGE = navigator.storage.persist().catch(function () { return false; });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
