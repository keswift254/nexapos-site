<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Return to NexaPOS</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7fb; --ink: #14141f; --ink-soft: #55556b; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0c14; --ink: #eef0fb; --ink-soft: #9aa0b4; --accent: #6366f1; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 540px; margin: 16vh auto; padding: 24px; text-align: center; }
    h1 { font-size: 28px; margin: 0 0 16px; letter-spacing: -0.02em; }
    p { color: var(--ink-soft); margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 24px; background: var(--accent); color: white; border-radius: 10px; text-decoration: none; font-weight: 600; box-shadow: 0 12px 28px -14px rgba(79,70,229,0.5); transition: transform 0.1s ease; }
    a:active { transform: translateY(1px); }
    a:focus-visible { outline: 3px solid #166534; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Return to NexaPOS</h1>
    <p>NexaPOS will confirm your payment and show your receipt.</p>
    <a id="return" href="nexapos://checkout-return">Open NexaPOS</a>
  </main>
  <script>
    // No transaction data or redirect targets are accepted from the query string.
    const android = /Android/i.test(navigator.userAgent);
    const destination = android
      ? 'intent://checkout-return#Intent;scheme=nexapos;package=com.nexapos.nexapos_mobile;end'
      : 'nexapos://checkout-return';
    document.getElementById('return').href = destination;
    window.location.replace(destination);
  </script>
</body>
</html>
