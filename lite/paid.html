<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Payment received</title>
  <style>
    html, body { margin: 0; padding: 0; background: #f4f5fa; color: #14141f; font-family: -apple-system, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    .page { max-width: 520px; margin: 0 auto; padding: 56px 20px; text-align: center; }
    h1 { font-size: 28px; margin: 0 0 14px; }
    p { line-height: 1.5; font-size: 18px; margin: 0 0 18px; color: #3a3a52; }
    .small { font-size: 15px; color: #6a6a80; margin-top: 40px; }
    a { color: #4f46e5; font-weight: 600; }
  </style>
</head>
<body>
  <div class="page">
    <h1 id="title">Thank you</h1>
    <p id="message">Your payment is being confirmed. You can close this page now.</p>
    <p class="small">Shop staff: <a href="/lite/">back to the till</a></p>
  </div>
  <script>
    // Where the customer's browser lands after the Paystack payment page (the platform tells Paystack to come here
    // for payments started from the Lite till). Nothing on the address is read or trusted: Paystack adds ?trxref=
    // and ?reference=, and the till asks the shop's server whether the sale was paid.
    //
    // Two kinds of visitor land here, told apart by a note the till leaves in THIS browser tab (sessionStorage, which
    // a customer's own phone never has):
    //  - the till itself, which sent this tab to Paystack to pay on the iPad: it is sent straight back to the till,
    //    which checks the payment and shows the receipt;
    //  - a customer who paid on their own phone (scanned the code): they just see the thank-you above.
    // Plain ES5 on purpose (old iPads).
    (function () {
      var cameFromTill = false;
      try {
        var raw = window.sessionStorage.getItem('nexapos-lite-return');
        var note = raw ? JSON.parse(raw) : null;
        cameFromTill = !!(note && note.saleId && (new Date().getTime() - note.when) < 6 * 60 * 60 * 1000);
      } catch (e) {
        cameFromTill = false;
      }
      if (cameFromTill) {
        document.getElementById('message').firstChild.nodeValue = 'Back to the till...';
        window.setTimeout(function () { window.location.replace('/lite/?back=1'); }, 250);
      }
    }());
  </script>
</body>
</html>
